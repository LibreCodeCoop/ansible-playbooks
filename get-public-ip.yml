# Gather IP facts from ipify.org
- name: Get my public IP
  hosts: all
  gather_facts: false
  become: true
  become_method: sudo
  tasks:
    - name: Get public ip
      community.general.ipify_facts:
      register: public_ip

    - name: Show public ip
      ansible.builtin.debug:
        msg: "{{ public_ip }}"


